[package]
name = "plamo-client"
version.workspace = true
edition.workspace = true

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }
