[package]
name = "plamo-translate-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "plamo-translate-mcp"
path = "src/main.rs"

[dependencies]
futures = "0.3.34"
plamo-client = { path = "../plamo-client", features = ["schemars"] }
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-std"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
rmcp = { version = "=3.8.0", features = ["client"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync"] }
