[package]
name = "plamo-translate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plamo-translate"
path = "src/main.rs"

[dependencies]
plamo-client = { path = "../plamo-client" }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
plist = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "io-std", "io-util", "time"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
serde_json = "1"
tempfile = "3"
predicates = "3"
